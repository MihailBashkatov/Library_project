version: '3.9'

services:
  web:
    image: miahilus/library_project
    container_name: library_project
    command: bash -c "python manage.py collectstatic --noinput && python manage.py migrate && python manage.py add_database && python manage.py createadmin  && gunicorn config.wsgi:application --bind 0.0.0.0:8000"

    env_file:
      - ./.env
    volumes:
      - static_volume:/app/staticfiles
    expose:
      - "8000"
    depends_on:
          db:
            condition: service_healthy

  nginx:
    image: miahilus/library_project_nginx:latest
    ports:
      - "80:80"
    volumes:
      - static_volume:/app/staticfiles
    depends_on:
      - web

  db:
    image: postgres:16
    restart: always
    container_name: library_project_psgr
    env_file:
      - ./.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}" ]
      interval: 30s
      timeout: 10s
      retries: 5

  redis:
    image: redis
    ports:
      - "6379:6379"
    env_file:
      - ./.env
    depends_on:
      - web

  celery:
    image: miahilus/library_project_celery
    container_name: library_project_celery
    command: bash -c "celery -A config worker -l INFO"
    env_file:
      - ./.env

    depends_on:
      - redis

  celery_beat:
    image: miahilus/library_project_celery_beat
    container_name: library_project_celery_beat
    command: bash -c "celery -A config worker --beat --scheduler django --loglevel=info"
    ports:
      - "5432:5432"
    env_file:
      - ./.env

    depends_on:
      - redis


volumes:
  postgres_data:
  static_volume:
  redis_data: